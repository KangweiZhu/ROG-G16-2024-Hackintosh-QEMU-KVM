# Deskflow server layout: the Linux host is the server ("linux"), the macOS guest the client ("mac").
# Since Deskflow 1.27 the screen names are not listed here but as [computer_<name>] groups in Deskflow.conf.
# Leaving the host screen by its top, left or right edge enters macOS; macOS' bottom/left/right edges return.
# On KDE Wayland the top edge never triggered here; left/right do. Match this to where your monitor sits,
# then Stop -> Start in the Deskflow window.
section: links
	linux:
		up = mac
		left = mac
		right = mac
	mac:
		down = linux
		left = linux
		right = linux
end
